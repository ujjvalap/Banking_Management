
spring.application.name=banking-management-system

server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=604800000

# Password
app.security.max-login-attempts=5
app.security.lock-duration-minutes=15
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Verification
app.security.email-verification-expiration=86400000
app.security.password-reset-expiration=900000

# Cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Error handling
server.error.include-message=never
server.error.include-stacktrace=never

# Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
